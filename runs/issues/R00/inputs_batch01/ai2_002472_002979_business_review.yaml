  unknowns_and_limits:
    - "机器人核心部件收入未单列：2025年报与2026半年报的分产品收入表均只有控制技术类/步进系统类/伺服系统类/其他四行，无“机器人核心部件”科目；正文称其为“四大核心品类”之一，属口径自相矛盾，机器人收入金额留HOLD"
    - "推断“机器人核心部件并入伺服系统类”缺少原文直接表述支撑，仅为按产品对应关系的合理推断，不可当作公司披露事实入库"
    - "2026三季报未拆产品结构，9M机器人部件收入与占比不可得；仅有伺服系统类9M累计10.08亿元这一含机器人与通用工控的混合口径"
    - "上海雷赛机器人净利润为推算值：按少数股东损益3,585,301.22元/30%=11,951,004.07元（约1,195.10万元，H1 2026），原文未直接列示该子公司净利润，仅列少数股东损益与少数股东权益"
    - "灵巧驱控、东莞雷赛机器人均为全资子公司且未列入“重要非全资子公司”，单体收入与利润未披露，其灵巧手/关节模组业务的盈亏不可验证"
    - "三季报p2资产负债表变动表增减率与同行列示金额不符（存货标+33.22%实为+49.75%、应收票据标+40.49%实为+68.03%、应收款项融资标+69.70%实为+230.02%），本报告不采用该表增减率"
    - "“在手订单超过100万台”为单位数口径，未折金额，且与2025年交付12万台不同口径，不可作为收入前瞻直接换算"
    - "未检索2026-10-25之后的任何公告；三季报为2026-10-22披露，属可采信范围，已纳入9M锚定"
