      s05_alert_investigation:
        rh04_check: "触发，0.276复核成立。2026H1合并经营活动现金流量净额44,527,240.04元，归母净利润161,325,506.86元，二者比值0.276，差额116,798,266.82元。现金流量表补充资料（半年报第130页）显示：经营性应收项目增加形成-144,941,184.16元调整，经营性应付项目减少形成-287,199,809.66元调整；存货减少带来+163,162,527.62元现金流正向调整。资产负债表（第17页）：应收账款由1,906,043,440.14元增至2,201,154,738.94元（增加295,111,298.80元，约+15.48%）；应收款项融资由453,991,137.59元降至249,125,305.34元；存货由1,477,631,881.64元降至1,278,894,333.49元（减少198,737,548.15元）；合同负债由586,305,307.30元降至399,653,893.68元（减少186,651,413.62元）。因此现金转化弱并非单一“客户没付款”：经营性应收占用现金、经营性应付净减少和合同负债下降共同压低经营现金流，存货去化部分抵消。半年报未对全部应收增加给出具体客户/项目原因，不能进一步归因。"
        rh06_check: "触发，低基数与非经常性损益影响均成立。2025H1归母净利润6,682,264.59元、扣非净利润-17,602,784.62元；2026H1归母净利润161,325,506.86元、扣非净利润70,171,662.89元。扣非利润同比改善87,774,447.51元并由负转正，但2025H1为负基数，498.64%的同比增幅不宜直接解读为可持续增速。2026H1非经常性损益净额91,153,843.97元，占归母净利润约56.50%；其中公允价值变动收益99,504,389.61元为主要项目，另有非经常性政府补助3,117,200元、应收款项减值准备转回2,218,892.71元、其他营业外收支3,152,294.02元等。半年报第17页说明公允价值收益来自南京工艺与南京化纤资产重组后，所持南京工艺股权置换为南京化纤股权并产生公允价值增加；第130页现金流量表补充资料将99,504,389.61元公允价值变动收益从净利润中扣回，说明其不是经营现金流。另有4,214,937.32元与主营业务相关的政府补助被列为经常性损益，不应与上述非经常性补助重复相加。"
